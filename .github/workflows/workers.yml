# Builds the Nebius worker images (nebius-workers/) and pushes them to GitHub Container Registry.
# Nebius Serverless AI pulls them from ghcr.io; set NEBIUS_TRAIN_IMAGE / NEBIUS_SERVE_IMAGE to the pushed tags.
name: workers

on:
  push:
    branches: [main]
    paths:
      - "nebius-workers/**"
      - ".github/workflows/workers.yml"
  workflow_dispatch:
    inputs:
      mamba_kernels:
        description: "Install the Mamba-2 kernels into the train image (required by the Nemotron-H modeling code)"
        type: choice
        options: ["1", "0"]
        default: "1"

permissions:
  contents: read
  packages: write

concurrency:
  group: workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        image: [train, serve]
    steps:
      # The base images (PyTorch devel, vLLM) are large; free space on the runner first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: name
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/forkline-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: nebius-workers
          file: nebius-workers/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            MAMBA_KERNELS=${{ github.event.inputs.mamba_kernels || '1' }}
          tags: |
            ${{ steps.name.outputs.ref }}:latest
            ${{ steps.name.outputs.ref }}:${{ github.sha }}
